name: CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_devotional
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: Run linting
        working-directory: ./backend
        run: |
          ruff check .
          black --check .

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_devotional
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: test-secret-key-for-ci-at-least-32-bytes-long
          ENCRYPTION_ROOT_KEY: test-encryption-key-32-chars-long
        run: |
          python manage.py migrate --run-syncdb --no-input
          pytest -v --cov=apps --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: devotional-journal-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: devotional-journal-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy to curlyphries.net
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: curlyphries
          key: ${{ secrets.DEVOTIONAL_JOURNAL_KEY }}
          script: |
            set -e
            cd /home/curlyphries/projects/devotional-journal

            echo "--- Pulling latest code ---"
            git pull --ff-only origin master

            # The server has Compose v2 only (the v1 "docker-compose" binary is
            # gone). COMPOSE_COMPATIBILITY keeps the existing "_" container names
            # so the systemd unit that starts this stack at boot adopts them.
            export COMPOSE_COMPATIBILITY=true
            PROD="docker compose -f docker-compose.prod.yml"

            echo "--- Rebuilding changed images ---"
            $PROD build

            echo "--- Restarting services ---"
            $PROD down
            $PROD up -d

            echo "--- Running migrations ---"
            $PROD run --rm dj-backend python manage.py migrate --no-input

            echo "--- Health check ---"
            sleep 5
            PROD_HOST=$(sed -n 's/^ALLOWED_HOSTS=//p' .env.prod | tail -1 | cut -d, -f1)
            curl -sf -H "Host: ${PROD_HOST:-localhost}" http://127.0.0.1:8010/api/v1/health/ \
              || echo "WARNING: health check failed"

            # Private mesh-only instance (devotional-journal.curlyphries.space). Deployed
            # only once it has been set up on the server (.env.mesh exists);
            # see docs/MESH_DEPLOYMENT.md. A failure here does not undo the
            # public deploy above, but it does fail the job so it is noticed.
            if [ -f .env.mesh ]; then
              echo "--- Updating private mesh instance ---"
              docker compose --env-file .env.mesh -p dj-mesh -f docker-compose.mesh.yml up -d --build
              sleep 15
              MESH_BIND=$(sed -n 's/^MESH_FRONTEND_BIND=//p' .env.mesh | tail -1)
              MESH_PORT=$(sed -n 's/^MESH_FRONTEND_PORT=//p' .env.mesh | tail -1)
              MESH_HOST=$(sed -n 's/^ALLOWED_HOSTS=//p' .env.mesh | tail -1 | cut -d, -f1)
              curl -sf -H "Host: ${MESH_HOST:-localhost}" \
                "http://${MESH_BIND:-127.0.0.1}:${MESH_PORT:-3011}/api/v1/health/" \
                || { echo "ERROR: mesh instance health check failed"; exit 1; }
            else
              echo "--- No .env.mesh on this server; skipping private mesh instance ---"
            fi

            echo "--- Deploy complete ---"
