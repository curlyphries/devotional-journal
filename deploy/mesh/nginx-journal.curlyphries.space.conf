# Host nginx site for the private instance.
#
#   sudo cp deploy/mesh/nginx-journal.curlyphries.space.conf /etc/nginx/sites-available/journal.curlyphries.space
#   sudo sed -i 's/MESH_IP/<this host's mesh address, e.g. 100.x.y.z>/g' /etc/nginx/sites-available/journal.curlyphries.space
#   sudo ln -s /etc/nginx/sites-available/journal.curlyphries.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two independent locks keep this off the public internet:
#   1. `listen MESH_IP:...` - nginx only accepts connections that arrive on the
#      mesh interface. The public interface never answers for this site.
#   2. `allow`/`deny` - even on that interface, only mesh addresses are served.
# (The app adds a third: MESH_ONLY in Django.)

server {
    listen MESH_IP:80;
    server_name journal.curlyphries.space;

    allow 100.64.0.0/10;          # Tailscale IPv4 range - change for another mesh
    allow fd7a:115c:a1e0::/48;    # Tailscale IPv6 range
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen MESH_IP:443 ssl;
    http2 on;
    server_name journal.curlyphries.space;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    # Issued with a DNS-01 challenge (the host is not reachable from the
    # internet, so HTTP-01 cannot work). See docs/MESH_DEPLOYMENT.md.
    ssl_certificate     /etc/letsencrypt/live/journal.curlyphries.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journal.curlyphries.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the app trusts this header from us.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
