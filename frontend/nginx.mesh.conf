# Frontend container config for a private (mesh-only) instance served at the
# root of its own host name, e.g. https://journal.curlyphries.space/
#
# TLS is terminated by the host proxy in front of this container (see
# deploy/mesh/). This container is published on 127.0.0.1 only.

map $http_x_forwarded_proto $dj_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The host proxy reaches us over the Docker bridge / loopback and tells us
    # the real client address. Believe that header only from those peers.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone is used for voice entry; nothing else is needed.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://mesh-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dj_forwarded_proto;
        # AI feedback on a local model can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
